[tool.poetry]
name = "gaia-exploration"
version = "0.1.0"
description = ""
authors = ["Nicolas Huber <nicolas.huber.dev@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
numpy = "^1.26.4"
pandas = "^2.2.0"
pydantic = "^2.6.1"
pendulum = "^3.0.0"
icecream = "^2.1.3"
loguru = "^0.7.2"
rich = "^13.7.0"
tqdm = "^4.66.2"
polars = "^0.20.7"
seaborn = ">=0.10.1,<0.13"  # Adjusted version constraint to match ydata-profiling requirement
httpx = "^0.26.0"
python-dotenv = "^1.0.1"
pylint = "^3.0.3"
black = "^24.2.0"
xlrd = "^2.0.1"
openpyxl = "^3.1.2"
scipy = ">=1.4.1,<1.12" # Adjusted version constraint to match ydata-profiling requirement
scikit-learn = "^1.4.1.post1"
ydata-profiling = "^4.7.0"
matplotlib = "3.7.3"  # Downgraded from 3.8.3 due to heatmap issue (https://github.com/mwaskom/seaborn/issues/3478); cannot upgrade searbon due to ydata
umap-learn = "^0.5.5"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
ipykernel = "^6.29.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
