[project]
name = "gaia-exploration"
version = "0.1.0"
description = "Exploratory data analysis and preprocessing of a Gaia DR3 sample (UTS 32130, Assessment Task 2)"
authors = [{ name = "Nicolas Huber" }]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.26.4,<2",
    "pandas>=2.2.0,<3",
    "pydantic>=2.6.1,<3",
    "pendulum>=3.0.0,<4",
    "icecream>=2.1.3,<3",
    "loguru>=0.7.2,<0.8",
    "rich>=13.7.0,<14",
    "tqdm>=4.66.2,<5",
    "polars>=0.20.7,<0.21",
    "seaborn>=0.10.1,<0.13",  # upper bound required by ydata-profiling
    "httpx>=0.26.0,<0.27",
    "python-dotenv>=1.0.1,<2",
    "xlrd>=2.0.1,<3",
    "openpyxl>=3.1.2,<4",
    "scipy>=1.4.1,<1.12",  # upper bound required by ydata-profiling
    "scikit-learn>=1.4.1.post1,<2",
    "ydata-profiling>=4.7.0,<5",
    "matplotlib==3.7.3",  # 3.8.3 breaks seaborn heatmaps (https://github.com/mwaskom/seaborn/issues/3478); seaborn cannot be upgraded because of ydata-profiling
    "umap-learn>=0.5.5,<0.6",
    "tabulate>=0.9.0,<0.10",  # used by DataFrame.to_markdown() in the notebook
    "setuptools>=69,<70",  # ydata-profiling 4.7 imports pkg_resources, which later setuptools versions removed
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0,<2",
    "ipykernel>=6.29.2,<7",
    "playwright>=1.42,<2",  # for nbconvert --to webpdf (PDF export without LaTeX)
]

[tool.uv]
package = false
# Resolve only package versions that existed when the assignment was submitted (April 2024).
exclude-newer = "2024-04-03T00:00:00Z"

[tool.ruff]
target-version = "py311"
line-length = 120
# The notebook is kept as submitted in 2024 and is not linted or formatted
extend-exclude = ["data", "*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]  # errors, Pyflakes, import sorting; no style modernisation
